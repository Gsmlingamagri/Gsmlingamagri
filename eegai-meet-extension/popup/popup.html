<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Eegai Meet</title>
<link rel="stylesheet" href="../lib/ui.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="p-head">
    <img src="../icons/icon48.png" alt="">
    <div>
      <div class="p-title">Eegai G Meet</div>
      <div class="p-sub">Auto admin &amp; attendance tracker</div>
    </div>
  </header>

  <section id="signedOut" class="p-body hidden">
    <p class="p-lead">Sign in with your Google (Gmail) account to start tracking attendance and saving reports to Google Sheets.</p>
    <button id="signIn" class="btn blue p-full">
      <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#fff" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.7 13.3l7.9 6.1C12.5 13.6 17.8 9.5 24 9.5z"/><path fill="#fff" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 6.9l7.4 5.7c4.3-4 6.9-9.9 6.9-17.1z"/><path fill="#fff" d="M10.6 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.1C1 16.6 0 20.2 0 24s1 7.4 2.7 10.7l7.9-6.1z"/><path fill="#fff" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.4-5.7c-2.1 1.4-4.8 2.3-8.5 2.3-6.2 0-11.5-4.1-13.4-9.9l-7.9 6.1C6.6 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </button>
    <p id="signInError" class="p-error hidden"></p>
  </section>

  <section id="signedIn" class="p-body hidden">
    <div class="p-user">
      <img id="avatar" alt="">
      <div class="p-user-text">
        <b id="userName"></b>
        <span id="userEmail" class="muted"></span>
      </div>
    </div>
    <div class="p-acct-actions">
      <button id="switchAcct" class="btn ghost sm">Switch account</button>
      <button id="addAcct" class="btn ghost sm">Add account</button>
      <button id="signOut" class="btn red sm">Sign out</button>
    </div>

    <label class="p-toggle">
      <span class="p-toggle-text">
        <b>Auto Admit</b>
        <small id="admitHint" class="muted">Admit people asking to join automatically</small>
      </span>
      <span class="switch"><input id="autoAdmit" type="checkbox"><span></span></span>
    </label>

    <div id="meetingBox" class="p-meeting">
      <span class="p-dot"></span>
      <span id="meetingText">Open a Google Meet to start tracking.</span>
    </div>

    <div class="p-grid">
      <button class="btn ghost" data-open="dashboard/dashboard.html#reports">My Reports</button>
      <button class="btn ghost" data-open="dashboard/dashboard.html#lists">Participant Lists</button>
      <button id="openSheet" class="btn">Attendance Sheet</button>
      <button class="btn ghost" data-open="dashboard/dashboard.html#settings">Settings</button>
    </div>
  </section>

  <footer class="p-foot">100% free · <a href="#" data-open="dashboard/dashboard.html#help">Help</a></footer>
  <script src="../lib/common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
